name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          RAW_VER=$(echo "$JAVA_VER_LINE" | sed -E 's/.*"([^"]+)".*/\1/')
          MAJOR_VER=$(echo "$RAW_VER" | awk -F. '{ if ($1 == "1") print $2; else print $1 }')
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]] || [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected version: $RAW_VER"
            exit 1
          fi
          echo "Verified active Java major version: $MAJOR_VER"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "ERROR: Failed to generate temporary ./debug.keystore."
                exit 1
              }
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist after generation step."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          echo "Verified debug APK exists at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
